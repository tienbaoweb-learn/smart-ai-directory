<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Dark overlay -->
  <rect width="1200" height="630" fill="#1E293B" opacity="0.15"/>

  <!-- Logo -->
  <g transform="translate(100, 80)">
    <rect width="80" height="80" rx="16" fill="white" opacity="0.95"/>
    <circle cx="40" cy="25" r="8" fill="#F97316"/>
    <circle cx="28" cy="45" r="6" fill="#F97316"/>
    <circle cx="52" cy="45" r="6" fill="#F97316"/>
    <path d="M20 65 Q40 75 60 65" stroke="#F97316" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Main text -->
  <text x="600" y="220" font-size="72" font-weight="bold" fill="white" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    SmartAI for Work
  </text>

  <!-- Subtitle -->
  <text x="600" y="290" font-size="36" fill="white" opacity="0.9" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    AI Tools Directory
  </text>

  <!-- Description -->
  <text x="600" y="380" font-size="28" fill="white" opacity="0.8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Furniture • Architecture • Construction • Real Estate
  </text>

  <!-- Industries badges -->
  <g transform="translate(200, 450)">
    <rect width="160" height="50" rx="8" fill="white" opacity="0.2"/>
    <text x="80" y="35" font-size="20" fill="white" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">200+ AI Tools</text>
  </g>

  <g transform="translate(520, 450)">
    <rect width="160" height="50" rx="8" fill="white" opacity="0.2"/>
    <text x="80" y="35" font-size="20" fill="white" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Expert Reviewed</text>
  </g>

  <g transform="translate(840, 450)">
    <rect width="160" height="50" rx="8" fill="white" opacity="0.2"/>
    <text x="80" y="35" font-size="20" fill="white" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Updated Weekly</text>
  </g>
</svg>